/* FPGT V3 design layer — product-showcase presentation on the existing white shell.
   Loaded last; it only restyles existing markup. White background, fixed left sidebar, four tabs. */
:root{--accent:#1f5fbf;--accent-strong:#174a99;--accent-soft:#eaf1fc;--ink:#141a22;--text:#1f2630;--muted:#566173;--line:#e2e6ec;--soft:#f5f7fa;--panel:#f6f8fb;--selected:#eaf1fc;--radius:12px;--radius-sm:8px;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);--shadow-lift:0 2px 4px rgba(16,24,40,.06),0 14px 32px rgba(16,24,40,.09)}
body{color:var(--text)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Sidebar ---------- */
.app-sidebar{padding:22px 14px 18px;gap:18px;border-right:1px solid var(--line)}
.app-brand{display:flex;flex-direction:row;align-items:center;gap:12px;padding:4px 8px 2px;font-size:calc(18px*var(--fs));font-weight:700;color:var(--ink);letter-spacing:-.01em;text-decoration:none}
.app-brand>span{font:inherit;color:inherit}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;flex-shrink:0}
.brand-mark .icon{width:22px;height:22px}
.brand-text{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-text small{font:450 calc(13px*var(--fs))/1.35 var(--font);color:var(--muted);letter-spacing:0;white-space:normal;margin-top:2px}
.lang-switch{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;background:var(--soft);border:1px solid var(--line);border-radius:10px}
.lang-switch button{min-height:36px;border:0;border-radius:8px;background:transparent;font:500 calc(14px*var(--fs))/1.2 var(--font);color:var(--muted);cursor:pointer;padding:6px 8px}
.lang-switch button:hover{color:var(--ink)}
.lang-switch button[aria-pressed=true]{background:#fff;color:var(--accent-strong);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.lang-switch.compact{display:inline-grid;margin-left:auto;grid-template-columns:auto auto}
.lang-switch.compact button{min-height:32px;padding:4px 12px}
.app-navigation{gap:4px}
.app-navigation>a{border-radius:var(--radius-sm);min-height:48px;padding:11px 12px;color:var(--text);text-decoration:none;font-weight:500;position:relative}
.app-navigation>a:hover{background:var(--soft)}
.app-navigation a.selected{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong)}
.app-navigation a.selected::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.sidebar-footer{flex-direction:column;align-items:flex-start;gap:2px;font-size:calc(13px*var(--fs));padding:16px 10px 0;border-top:1px solid var(--line)}
.sidebar-footer span:last-child{font-family:var(--mono);font-size:calc(12px*var(--fs))}

/* ---------- Shared building blocks ---------- */
.button{border-radius:var(--radius-sm);font-weight:500;min-height:44px;padding:10px 18px;transition:background .15s,border-color .15s,box-shadow .15s;text-decoration:none}
.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.button.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.button.primary .icon{color:#fff}
.button:not(.primary):hover{border-color:#b9c3d1;background:#fff;box-shadow:var(--shadow)}
.eyebrow{font-size:calc(13px*var(--fs));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.badge{border-radius:999px;padding:4px 10px;background:#fff}

/* ---------- Tham khảo sản phẩm / Applications ---------- */
.product-main{max-width:1320px;margin-inline:auto;padding:48px 48px 64px}
.pr-page{font-size:calc(17px*var(--fs));line-height:1.75}
.pr-heading{max-width:980px;padding:8px 0 44px}
.pr-eyebrow{display:inline-block;font-size:calc(13px*var(--fs));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.pr-page h1{font-size:calc(44px*var(--fs));line-height:1.14;letter-spacing:-.025em;font-weight:700;color:var(--ink);margin:14px 0 20px;max-width:900px}
.pr-heading>p{font-size:calc(19px*var(--fs));line-height:1.75;color:#3b4554;max-width:900px}
.pr-jump{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.pr-jump a{display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border:1px solid var(--line);border-radius:999px;font-size:calc(15px*var(--fs));font-weight:500;color:var(--ink);text-decoration:none;background:#fff;transition:border-color .15s,box-shadow .15s}
.pr-jump a span{display:grid;place-items:center;min-width:28px;height:28px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font-size:calc(13px*var(--fs));font-weight:600}
.pr-jump a:hover{border-color:#b9c3d1;box-shadow:var(--shadow);text-decoration:none}
.pr-block{padding:52px 0 56px;border-top:0}
.pr-block-heading{gap:18px;margin-bottom:36px;align-items:flex-start}
.pr-section-number{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;font-size:calc(15px*var(--fs));padding:0;flex-shrink:0}
.pr-page h2{font-size:calc(32px*var(--fs));line-height:1.2;letter-spacing:-.02em;font-weight:700;color:var(--ink)}
.pr-block-heading p{font-size:calc(17px*var(--fs));margin-top:8px}
.pr-page h3{font-size:calc(25px*var(--fs));line-height:1.3;letter-spacing:-.015em;font-weight:650;color:var(--ink);margin:10px 0 16px}
.pr-label{display:inline-flex;gap:8px;align-items:center;font-size:calc(14px*var(--fs));font-weight:500;color:var(--muted);letter-spacing:0}
.pr-label b{font-weight:600;color:var(--accent-strong);background:var(--accent-soft);border-radius:6px;padding:1px 8px}
.pr-story{gap:56px;align-items:center}
.pr-story+.pr-story{border-top:1px solid var(--line);padding-top:56px;margin-top:56px}
.pr-story-copy{max-width:600px}
.pr-player,.pr-frame{border-radius:var(--radius);box-shadow:var(--shadow);border:0}
.pr-frame{border:1px solid var(--line)}
.pr-figure-portrait .pr-frame{box-shadow:none}
.pr-figure-portrait .pr-frame img{border-radius:14px;box-shadow:var(--shadow-lift);border:1px solid var(--line)}
.pr-frame:hover{box-shadow:var(--shadow-lift)}
.pr-media figcaption{font-size:calc(14px*var(--fs));margin-top:12px;line-height:1.6}
.pr-media-bar{font-size:calc(15px*var(--fs));margin-top:12px}
.pr-watch{font-weight:600;color:var(--accent)}
.pr-evidence{border-left:3px solid var(--accent);background:var(--soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 20px}
.pr-evidence h4{color:var(--accent-strong);font-size:calc(15px*var(--fs));font-weight:650}
.pr-page .pr-citations{font-size:calc(14px*var(--fs))}
.pr-citations a,.pr-source-list a{color:var(--accent)}
.pr-block-tint{position:relative;background:var(--soft);border-radius:20px;padding:52px 44px 56px;margin:8px -44px}
.pr-vietnam-grid{gap:48px}
.pr-vietnam-story{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 28px 30px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.pr-vietnam-story .pr-media{margin:20px 0 22px}
.pr-deployment{border-top:1px solid var(--line);margin:26px 0 20px}
.pr-deployment-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.pr-deployment-facts>div{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--soft)}
.pr-deployment-facts dt{font-size:calc(18px*var(--fs));font-weight:650;color:var(--ink)}
.pr-deployment-facts dd{font-size:calc(14px*var(--fs))}
.pr-future{border-top:0}
.pr-future>p{font-size:calc(18px*var(--fs));max-width:900px}
.pr-actions{margin-top:28px}
.pr-evidence-footer{border-top:1px solid var(--line);padding-top:28px}
.pr-evidence-footer summary{font-weight:600}

/* ---------- Dự án / Project ---------- */
main{max-width:1280px;padding:44px 44px 0}
.project-hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:56px;align-items:center;padding:8px 0 36px}
.ph-eyebrow{font-size:calc(13px*var(--fs));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.project-hero h1{font-size:calc(46px*var(--fs));line-height:1.1;letter-spacing:-.03em;font-weight:750;color:var(--ink);margin:14px 0 18px}
.project-hero h1 span{display:block;color:#4b5667;font-weight:600;font-size:.7em;letter-spacing:-.02em;margin-top:6px}
.ph-lead{font-size:calc(19px*var(--fs));line-height:1.75;color:#3b4554;max-width:620px}
.ph-points{list-style:none;padding:0;margin:26px 0 30px;display:grid;gap:12px;max-width:640px}
.ph-points li{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line);font-size:calc(16px*var(--fs));line-height:1.6}
.ph-points strong{font-weight:650;color:var(--ink)}
.ph-points span{color:var(--muted)}
.ph-actions{display:flex;gap:12px;flex-wrap:wrap}
.ph-visual{margin:0}
.ph-visual .chip-image-button{position:relative;display:block;width:100%;padding:0;border:0;border-radius:18px;overflow:hidden;cursor:zoom-in;background:#0f1114;box-shadow:var(--shadow-lift)}
.ph-visual img{display:block;width:100%;height:540px;object-fit:cover;object-position:center 40%}
.ph-visual .image-expand{position:absolute;right:14px;bottom:14px;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.92);color:var(--ink)}
.ph-visual figcaption{font-size:calc(14px*var(--fs));color:var(--muted);margin-top:12px}
.overview-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:8px 0 24px}
.overview-stat{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 18px}
.stat-label{display:flex;gap:8px;align-items:center;font-size:calc(14px*var(--fs));color:var(--muted);font-weight:500}
.stat-label .icon{width:18px;height:18px;color:var(--accent)}
.stat-value{font-size:calc(30px*var(--fs));font-weight:700;letter-spacing:-.02em;color:var(--ink);margin:10px 0 6px;line-height:1.2}
.stat-value small{font-size:calc(16px*var(--fs));font-weight:500;color:var(--muted)}
.stat-note{display:flex;align-items:center;gap:6px;font-size:calc(14px*var(--fs));color:var(--muted)}
.metric-source{border:0;background:transparent;padding:2px;color:var(--muted);cursor:pointer;border-radius:6px;display:inline-flex}
.metric-source:hover{color:var(--accent);background:#fff}
.metric-source .icon{width:16px;height:16px}
#main>.section{margin:0;padding:64px 0}
#main>.section.band{background:var(--soft);box-shadow:0 0 0 100vmax var(--soft);clip-path:inset(0 -100vmax)}
.section-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px}
.section-heading .eyebrow span{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:7px;background:var(--accent);color:#fff;font-size:calc(12px*var(--fs));letter-spacing:0;margin-right:10px}
.section-heading h2{font-size:calc(32px*var(--fs));line-height:1.2;letter-spacing:-.02em;font-weight:700;color:var(--ink);margin-top:10px}
.section-heading p{font-size:calc(17px*var(--fs));max-width:720px}
.purpose-layout{gap:56px}
.purpose-lead>p:first-child{font-size:calc(19px*var(--fs));color:#3b4554}
.formula{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;font-size:calc(30px*var(--fs));font-weight:600;color:var(--ink)}
.reason{display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line);margin:0}
.reason>span{font-weight:650;color:var(--accent);min-width:28px}
.reason h3{font-size:calc(19px*var(--fs));color:var(--ink);margin-bottom:6px}
.panel{border-radius:var(--radius);background:#fff;border-color:var(--line)}
.architecture{padding:28px;box-shadow:var(--shadow)}
.arch-node{border-radius:var(--radius);transition:border-color .15s,box-shadow .15s,transform .15s;cursor:pointer}
.arch-node:hover{border-color:#9db7e0;box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.array-node{background:var(--accent-soft);border-color:#c9daf5}
.node-number{display:block;font-size:calc(13px*var(--fs));font-weight:600;color:var(--accent)}
.pe-grid{display:grid;grid-template-columns:repeat(8,10px);gap:3px;justify-content:center;margin:10px auto 4px}
.pe-grid i{width:10px;height:10px;border-radius:2px;background:#8fb2e6}
.arch-node .icon{width:26px;height:26px;color:var(--accent);margin:8px auto}
.spec-panel{border:0;background:transparent;gap:16px}

  'pr.why.p1':'Nhiều ứng dụng AI gửi dữ liệu lên máy chủ rồi chờ kết quả. Xử lý ngay trên thiết bị có lợi trong ba trường hợp:',

  'pr.why.n2d':'Thiết bị ở nút giao, nhà xưởng hay vùng xa vẫn làm việc khi kết nối chập chờn.',
  'pr.why.n3t':'Dữ liệu cần ở lại tại chỗ',
  'pr.why.n3d':'Hình ảnh và câu hỏi được xử lý trên thiết bị; chỉ kết quả cần thiết mới được gửi đi.','pr.why.close':'Khó khăn là thiết bị nhỏ có bộ xử lý, bộ nhớ và nguồn điện hạn chế. Muốn chạy AI tốt, chúng cần phần cứng tính toán chuyên dụng, và đó là điều FPGT hướng tới.',
  
  
  'pr.role.title':'FPGT đóng góp gì?',
  'pr.role.lead':'Một khối tính toán đặt cạnh bộ xử lý chính, nhận phần việc nặng nhất khi chạy AI.',
  'pr.role.p1':'Khi chạy một mô hình AI, thiết bị phải lặp lại cùng một kiểu phép tính trên hàng triệu con số. Bộ xử lý thông thường chỉ làm được vài phép tính cùng lúc nên mất nhiều thời gian. FPGT có 1.024 bộ tính nhỏ cùng làm việc này một lúc, nhằm giúp thiết bị phản hồi nhanh hơn ngay tại chỗ. Bộ xử lý chính vẫn điều khiển chương trình; FPGT là bộ phận hỗ trợ, không phải một máy AI hoàn chỉnh.',
  'pr.role.tech':'Về kỹ thuật: đó là phép nhân ma trận (GEMM) trên số nguyên 8 bit, do mảng xử lý 32 × 32 thực hiện.',
  
  
  
  
  
  
  
  
  
  
  'pr.gloss.summary':'Giải thích nhanh một số thuật ngữ',

  'pr.world.title':'Ứng dụng tiềm năng trên thế giới',

  'pr.scope.title':'Những nơi FPGT có thể được ứng dụng, không phải nơi FPGT đã được tích hợp',
  'pr.scope.body':'Bốn ví dụ dưới đây là sản phẩm AI đang hoạt động của các đơn vị khác, hai trên thế giới và hai tại Việt Nam. Chúng cho thấy những loại thiết bị mà công nghệ như FPGT có thể được nghiên cứu để phục vụ. FPGT chưa được tích hợp vào sản phẩm nào trong số này; muốn dùng thực tế cần tích hợp, kiểm tra tương thích phần cứng, phần mềm và đánh giá hiệu quả trên từng hệ thống.',

  'pr.label.third':'Sản phẩm bên thứ ba',
  'pr.w01.title':'Trợ lý AI chạy ngay trên máy tính nhỏ',
  'pr.w01.p1':'Raspberry Pi 5 gắn bo mạch AI HAT+ 2 (chip Hailo) trả lời câu hỏi bằng mô hình ngôn ngữ chạy ngay trên máy, không cần Internet. Trợ lý vẫn dùng được khi mất mạng và câu hỏi không rời khỏi thiết bị.',
  
  'pr.w01.evTitle':'FPGT đã thử nghiệm gì',
  'pr.w01.ev':'Mô hình ngôn ngữ là loại tác vụ FPGT đã chạy thử. Trên bo mạch FPGA, FPGT giúp một mô hình Qwen nhỏ đọc câu hỏi nhanh hơn khoảng 2,2–2,9 lần so với chỉ dùng CPU; bước sinh câu trả lời vẫn chạy trên CPU.',
  'pr.w01.more':'Chi tiết thử nghiệm',
  'pr.w01.moreBody':'Mô hình Qwen2.5-0.5B-Instruct chạy bằng llama.cpp trên bo mạch Kria KV260 (CPU 4 nhân Cortex-A53, khối tăng tốc 100 MHz). Chỉ các phép nhân ma trận đủ lớn (M ≥ 32) được giao cho FPGA; bước sinh từng từ (M = 1) ở lại CPU, nên tốc độ sinh câu trả lời gần như không đổi. Tài liệu tích hợp (cố định theo commit) ghi mức tăng tốc 2,18–2,90 lần với câu hỏi 32, 128 và 512 token, sinh 64 token; báo cáo dự thi của nhóm ghi 2,21–2,93 lần ở một loạt đo khác. Đây là kết quả FPGA, chưa được đo trên bản ASIC. Một bản mã nguồn KV260 khác trong hồ sơ ASIC chưa có ngưỡng M ≥ 32; hai phiên bản chưa được đối chiếu.',
  'pr.w01.limit':'Raspberry Pi dùng chip Hailo, không dùng FPGT; số liệu của hai hệ thống không so sánh trực tiếp được.',
  'pr.w02.title':'Camera tự nhận ra người và phương tiện',
  'pr.w02.p1':'AXIS Object Analytics là phần mềm cài sẵn trên camera Axis. Camera tự phát hiện, phân loại và đếm người, phương tiện, đồng thời cảnh báo khi có đối tượng dừng quá lâu. Người vận hành nhận con số và cảnh báo thay vì ngồi xem video, và chỉ kết quả cần gửi về trung tâm.',
  
  'pr.w02.evTitle':'FPGT có thể đóng góp ở đâu',
  'pr.w02.ev':'Nhận dạng hình ảnh cũng cần khối lượng tính toán lớn cùng loại, nên camera thông minh là hướng ứng dụng tiềm năng của FPGT. Hướng này đang ở giai đoạn nghiên cứu: cần chọn mô hình phù hợp, rồi kiểm tra tốc độ và độ chính xác trên thiết bị thật.',
  'pr.vn.title':'Ứng dụng tiềm năng tại Việt Nam',
  'pr.vn.lead':'Chatbot dịch vụ công và camera AI giao thông đã được dùng ở Hà Nội. Đây cũng là hệ thống của các đơn vị khác, gần với hai hướng nghiên cứu của FPGT.',
  'pr.v01.label':'V01 · Dịch vụ công',
  'pr.v01.title':'Hỏi thủ tục hành chính bằng hội thoại',
  'pr.v01.p1':'Chatbot trên ứng dụng iHanoi trả lời người dân về giấy tờ, lệ phí và quy trình nộp hồ sơ, thay vì để họ tự tìm trong nhiều văn bản. Theo hướng dẫn chính thức của Hà Nội ngày <time datetime="2026-04-13">13/4/2026</time>, chatbot được giới thiệu là hoạt động 24/7.',
  
  'pr.v01.evTitle':'FPGT có thể đóng góp ở đâu',
  'pr.v01.ev':'Hỏi đáp bằng ngôn ngữ tự nhiên là cùng loại tác vụ với thử nghiệm mô hình ngôn ngữ của FPGT. Phần cứng như FPGT có thể được nghiên cứu cho các trợ lý tương tự chạy tại chỗ, chẳng hạn máy hỏi đáp ở nơi tiếp nhận hồ sơ. iHanoi là hệ thống của thành phố và không liên quan đến FPGT.',
  'pr.v02.label':'V02 · Giao thông',
  'pr.v02.title':'Camera AI theo dõi giao thông',
  'pr.v02.aTitle':'VNPT SmartVision: biến video thành thông tin',
  'pr.v02.a':'Nền tảng phân tích video của VNPT nhận diện biển số, phân loại phương tiện, đo lưu lượng và phát hiện sự kiện giao thông, để cơ quan quản lý không phải theo dõi từng màn hình. Theo case study của NVIDIA, một phần xử lý chạy trên thiết bị biên Jetson, phần còn lại trên máy chủ GPU tại chỗ.',
  'pr.v02.bTitle':'Camera AI giao thông tại Hà Nội',
  'pr.v02.bLead':'Hệ thống do Công an TP. Hà Nội vận hành. Số liệu lấy từ báo cáo của cơ quan nhà nước, <strong>không phải số liệu của VNPT SmartVision</strong>.',
  'pr.v02.f1':'Khoảng 1.837 camera AI',

  'pr.v02.f2':'195 nút giao trọng điểm',

  'pr.v02.f3':'6.351 trường hợp đã rà soát',
  'pr.v02.f3d':'Đủ căn cứ gửi thông báo vi phạm, từ 13/12/2025 đến 12/01/2026; không phải tổng số vụ đã nộp phạt.',
  'pr.v02.f4':'2.460 camera bổ sung',
  'pr.v02.f4d':'Giai đoạn hai, vận hành từ ngày 1/7/2026.',
  'pr.v02.evTitle':'FPGT có thể đóng góp ở đâu',
  'pr.v02.ev':'Camera giao thông phải nhận dạng liên tục rất nhiều khung hình, đúng loại tính toán nặng mà FPGT được thiết kế để đảm nhận. Vì vậy thị giác máy tính là hướng mở rộng tự nhiên của FPGT, cần được thử với mô hình cụ thể trên thiết bị biên. Các hệ thống trên đều độc lập với FPGT.',
  'pr.future.title':'Bước tiếp theo',

  'pr.future.close':'FPGT vẫn là một thành phần nghiên cứu; mỗi hướng cần được kiểm chứng trên hệ thống thực trước khi đưa vào sử dụng.',

  'pr.why.title':'Why process AI on the device itself?',
  'pr.why.lead':'A server is not always the best place to process data.',
  'pr.why.p1':'Many AI apps send data to a server and wait for the result. Running AI on the device helps in three situations:',
  'pr.why.n1t':'An answer is needed now',
  'pr.why.n1d':'A camera or assistant responds on the spot, without waiting for data to travel and come back.',
  'pr.why.n2t':'The network is unreliable',
  'pr.why.n2d':'Devices at intersections, in factories or in remote areas keep working when the connection drops.',
  'pr.why.n3t':'Data should stay local',
  'pr.why.n3d':'Images and questions are processed on the device; only the results that matter are sent on.','pr.why.close':'The catch is that small devices have limited processing power, memory and energy. To run AI well they need dedicated compute hardware, and that is what FPGT sets out to provide.',
  
  
  'pr.role.title':'Where FPGT fits in',
  'pr.role.lead':'A compute block that sits beside the main processor and takes on the heaviest part of running AI.',
  'pr.role.p1':'Running an AI model means repeating the same kind of calculation over millions of numbers. A general-purpose processor can only do a few of these at a time, so it takes a while. FPGT has 1,024 small compute units that work on them simultaneously, aiming to let the device respond faster on the spot. The main processor still runs the program; FPGT is a helper, not a complete AI computer.',
  'pr.role.tech':'Technically, this is INT8 matrix multiplication (GEMM), carried out by a 32 × 32 processing array.',
  
  
  
  
  
  
  
  
  
  
  'pr.gloss.summary':'A few terms, briefly explained',
  'pr.gloss.1t':'Matrix multiplication (GEMM)',
  'pr.gloss.1d':'Multiplying two large tables of numbers. Language models and many image-recognition models spend most of their compute time on it.',
  'pr.gloss.2t':'INT8',
  'pr.gloss.2d':'Each number uses 8 bits (an integer from −128 to 127). Compact numbers let hardware compute faster and more efficiently; FPGT takes its inputs in this form.',
  'pr.gloss.3t':'FPGA',
  'pr.gloss.3d':'A chip that can be reprogrammed to behave like new hardware, which makes it well suited to testing a design before building a dedicated chip.',
  'pr.gloss.4t':'ASIC',
  'pr.gloss.4d':'A chip designed for one specific task. Getting there requires a complete physical design (layout) before manufacturing.',
  'pr.gloss.5t':'Reading the question, writing the answer',
  'pr.gloss.5d':'A language model reads the whole prompt at once (prefill), then writes the answer one token at a time (decode). The first step is full of large matrix multiplications, so it benefits most from FPGT.',
  'pr.world.title':'Potential applications worldwide',
  'pr.scope.tag':'How to read these examples',
  'pr.scope.title':'Where FPGT could be used, not where it is used today',
  'pr.scope.body':'The four examples below are working AI products from other organisations, two from around the world and two from Vietnam. They show the kinds of devices that technology like FPGT could be studied for. FPGT has not been integrated into any of them; real use would require integration, hardware and software compatibility checks, and an evaluation on each system.',
  'pr.scope.k1t':'Third-party product',
  'pr.scope.k1d':'Photos, video and figures from the publisher',
  'pr.scope.k2t':'FPGT result',
  'pr.scope.k2d':'Measured by the team, with test conditions',
  'pr.scope.k3t':'Potential for FPGT',
  'pr.scope.k3d':'A research direction, not yet tested',
  
  'pr.label.third':'Third-party product',
  'pr.w01.title':'An AI assistant on a small computer',
  'pr.w01.p1':'A Raspberry Pi 5 fitted with the AI HAT+ 2 board (Hailo chip) answers questions with a language model running on the device, with no Internet connection. The assistant keeps working offline, and questions never leave the device.',
  
  'pr.w01.evTitle':'What FPGT has been tested on',
  'pr.w01.ev':'Language models are the workload FPGT has actually been tested on. On an FPGA board, FPGT made a small Qwen model read prompts about 2.2–2.9× faster than the CPU alone; writing the answer still runs on the CPU.',
  'pr.w01.more':'Test details',
  'pr.w01.moreBody':'Qwen2.5-0.5B-Instruct running in llama.cpp on a Kria KV260 board (four Cortex-A53 cores; accelerator at 100 MHz). Only large enough matrix multiplications (M ≥ 32) go to the FPGA; token-by-token decoding (M = 1) stays on the CPU, so reply-generation speed is nearly unchanged. The commit-pinned integration document reports 2.18–2.90× (prompts of 32, 128 and 512 tokens, 64 generated tokens); the team’s competition report gives 2.21–2.93× for a separate run. These are FPGA results and have not been measured on the ASIC. A different KV260 source snapshot in the ASIC evidence package lacks the M ≥ 32 threshold; the two versions have not been reconciled.',
  'pr.w01.limit':'Raspberry Pi uses a Hailo chip, not FPGT; the two systems’ figures cannot be compared directly.',
  'pr.w02.title':'A camera that recognises people and vehicles',
  'pr.w02.p1':'AXIS Object Analytics comes preinstalled on Axis cameras. The camera detects, classifies and counts people and vehicles, and raises an alert when something stays too long. Operators get numbers and alerts instead of hours of footage, and only the results need to reach the control room.',
  
  'pr.w02.evTitle':'Where FPGT could help',
  'pr.w02.ev':'Image recognition relies on the same kind of heavy calculation, which makes smart cameras a promising direction for FPGT. This direction is still at the research stage: a suitable model has to be chosen, then tested for speed and accuracy on a real device.',
  'pr.vn.title':'Potential applications in Vietnam',
  'pr.vn.lead':'Public-service chatbots and AI traffic cameras are already in use in Hanoi. These are also other organisations’ systems, close to FPGT’s two research directions.',
  'pr.v01.label':'V01 · Public services',
  'pr.v01.title':'Asking about paperwork in plain language',
  'pr.v01.p1':'The chatbot in the iHanoi app answers residents’ questions about documents, fees and application steps, so they do not have to dig through regulations. Hanoi’s official guide of <time datetime="2026-04-13">13 April 2026</time> presents the chatbot as available 24/7.',
  
  'pr.v01.evTitle':'Where FPGT could help',
  'pr.v01.ev':'Answering questions in natural language is the same kind of task as FPGT’s language-model test. Hardware like FPGT could be studied for similar assistants that run locally, such as Q&A kiosks at service counters. iHanoi is a city system and has no connection with FPGT.',
  'pr.v02.label':'V02 · Traffic',
  'pr.v02.title':'AI cameras that monitor traffic',
  'pr.v02.aTitle':'VNPT SmartVision: turning video into information',
  'pr.v02.a':'VNPT’s video analytics platform reads number plates, classifies vehicles, measures traffic flow and detects incidents, so authorities can follow the situation without watching every screen. According to an NVIDIA case study, part of the processing runs on Jetson edge devices and the rest on on-site GPU servers.',
  'pr.v02.bTitle':'AI traffic cameras in Hanoi',
  'pr.v02.bLead':'A separate system operated by Hanoi City Police. The figures come from government reports and are <strong>not attributed to VNPT SmartVision</strong>.',
  'pr.v02.f1':'About 1,837 AI cameras',
  'pr.v02.f1d':'In operation since 13 December 2025.',
  'pr.v02.f2':'195 key intersections',
  'pr.v02.f2d':'First phase.',
  'pr.v02.f3':'6,351 reviewed cases',
  'pr.v02.f3d':'Enough evidence to send a violation notice, 13 December 2025–12 January 2026; not a total of paid fines.',
  'pr.v02.f4':'2,460 additional cameras',
  'pr.v02.f4d':'Phase two, in operation since 1 July 2026.',
  'pr.v02.evTitle':'Where FPGT could help',
  'pr.v02.ev':'Traffic cameras recognise objects in a constant stream of frames, the kind of heavy calculation FPGT is designed to take on. That makes computer vision a natural next direction for FPGT, to be tested with specific models on edge devices. Neither system uses FPGT.',
  'pr.future.title':'Next steps',
  'pr.future.p':'So far, FPGT has made a language model read prompts faster on an FPGA, and the design has been taken through to a chip layout. Three directions follow:',
  'pr.future.d1t':'On-device AI assistants',
  'pr.future.d1k':'Tested',
  'pr.future.d1':'Try more language models and cut the time spent moving data between the CPU and the accelerator.',
  'pr.future.d2t':'Cameras and computer vision',
  'pr.future.d2k':'Needs further research',
  'pr.future.d2':'Run image-recognition models on FPGT and measure speed and accuracy on real devices.',
  'pr.future.d3t':'A compute core for AI chips',
  'pr.future.d3k':'In progress',
  'pr.future.d3':'Standardise the interface, documentation and tests for integration into a system-on-chip (SoC); improve the ASIC’s timing and power.',
  'pr.future.close':'FPGT is still a research component; each direction must be proven on a real system before it is put to use.',
  'pr.cta.project':'Explore the project',
  'pr.cta.layout':'Inspect the 3D layout',
  'pr.footer':'Products from Raspberry Pi, Axis and VNPT, and Hanoi’s camera system, are reference examples only and imply no partnership with FPGT. The text works offline; images, videos and source pages need an Internet connection.',

const missing=new Set();
// URL (?lang=vi|en) > remembered choice > Vietnamese. Browser locale is deliberately ignored.
function initialLanguage(){
 let requested=null;try{requested=new URLSearchParams(location.search).get('lang');}catch{}
 if(LANGS.includes(requested)){try{localStorage.setItem(LANGUAGE_KEY,requested);}catch{}return requested;}
 try{const saved=localStorage.getItem(LANGUAGE_KEY);if(LANGS.includes(saved))return saved;}catch{}
 return 'en';
}
function rememberLanguage(lang){
 try{localStorage.setItem(LANGUAGE_KEY,lang);}catch{}
 try{const url=new URL(location.href);if(url.searchParams.has('lang')){url.searchParams.set('lang',lang);history.replaceState(history.state,'',url);}}catch{}
}
// Missing keys fall back to the other language, then to the key itself, and are recorded.
function translator(lang){
 return (key,vars)=>{let text=messages[lang]?.[key];if(text===undefined){missing.add(lang+':'+key);text=messages[lang==='vi'?'en':'vi']?.[key]??key;}
  return vars?text.replace(/\{(\w+)\}/g,(m,name)=>vars[name]??m):text;};
}
function missingTranslations(){return [...missing];}

      <details class="sp-distinction" id="sp-distinction"><summary>${t('Timing conditions & source differences','Điều kiện timing & khác biệt nguồn')}<span>${t('Targets, methods and revisions stay separate','Giữ riêng mục tiêu, phương pháp và revision')}</span></summary><div>${data.discrepancies.map(d=>`<article><h3>${esc(L(d.label))}</h3><div class="sp-compare"><span>${d.currentLabel?esc(L(d.currentLabel)):t('Current / final','Hiện tại / cuối')}<strong>${d.current===null?'N/A':num(d.current)} ${d.unit}</strong></span><span>${d.previousLabel?esc(L(d.previousLabel)):t('Other / earlier','Khác / trước đó')}<strong>${d.previous===null?'N/A':num(d.previous)} ${d.unit}</strong></span></div><p>${esc(L(d.notes))}</p><button data-sp-conflict="${d.id}">${t('Inspect both sources','Đối chiếu các nguồn')} ↗</button></article>`).join('')}</div></details>
      <div class="sp-browser" id="sp-browser"><div class="sp-filterbar"><label class="sp-search">${icons.search}<input id="sp-search" value="${esc(state.q)}" placeholder="${t('Search names, values, units or sources…','Tìm tên, giá trị, đơn vị hoặc nguồn…')}" aria-label="${t('Search specifications','Tìm thông số')}"><kbd>/</kbd></label>      <label class="sp-category-control">${t('Category','Nhóm thông số')} <select id="sp-category" aria-label="${t('Specification category','Nhóm thông số')}">${[['all',t('All categories','Mọi nhóm')],...data.categories.map(c=>[c.id,L(c.label)]),['sources',t('Sources','Nguồn')]].map(([id,name])=>`<option value="${id}" ${state.category===id?'selected':''}>${esc(name)}</option>`).join('')}</select></label><select id="sp-basis" aria-label="${t('Evidence type','Loại bằng chứng')}"><option value="all">${t('All evidence types','Mọi loại bằng chứng')}</option>${['configured','reported','derived','estimated','reference','documented','unavailable'].map(b=>`<option value="${b}" ${state.basis===b?'selected':''}>${basis(b)}</option>`).join('')}</select><select id="sp-scope" aria-label="${t('Data scope','Phạm vi dữ liệu')}">${[['all',t('All scopes','Mọi phạm vi')],['top',t('Top level','Cấp top')],['ip',t('Full IP hierarchy','Toàn IP phân cấp')],['other',t('Other / reference','Khác / tham chiếu')]].map(([id,n])=>`<option value="${id}" ${state.scope===id?'selected':''}>${n}</option>`).join('')}</select><button data-sp-action="reset">${t('Reset','Đặt lại')}</button></div>
<div class="sp-table-tools"><span id="sp-results-count" role="status"></span><div><select id="sp-sort" aria-label="${t('Sort specifications','Sắp xếp thông số')}"><option value="name">${t('Parameter A–Z','Tên A–Z')}</option><option value="value">${t('Value, ascending','Giá trị tăng dần')}</option></select><button data-sp-action="expand">${t('Expand all','Mở tất cả')}</button><button data-sp-action="collapse">${t('Collapse all','Thu tất cả')}</button><button class="sp-export" data-sp-action="export">↓ ${t('Export filtered CSV','Xuất CSV đã lọc')}</button></div></div>

      <dialog id="sp-dialog" aria-labelledby="sp-dialog-title"><div id="sp-dialog-content"></div></dialog><div id="sp-toast" role="status" aria-live="polite"></div>`;
    $('#sp-sort').value=state.sort;renderResults();
    $('#sp-dialog').addEventListener('close',()=>{lastFocus?.focus({preventScroll:true});});
    $('#sp-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();}});
  }
  function inScope(m){return state.scope==='all'||(state.scope==='top'?m.scope.en==='Top level':state.scope==='ip'?m.scope.en==='Full IP hierarchy':!['Top level','Full IP hierarchy'].includes(m.scope.en));}
  function qMatches(text){const corpus=fold(text);return fold(state.q).trim().split(/\s+/).every(word=>corpus.includes(word));}
  function matched(){return data.metrics.filter(m=>(state.category==='all'||m.category===state.category)&&(state.basis==='all'||m.basis===state.basis)&&inScope(m)&&qMatches([m.label.en,m.label.vi,m.value,val(m),m.unit,m.scope.en,m.scope.vi,m.stage.en,m.stage.vi,m.notes.en,m.notes.vi,...m.evidence.map(e=>data.sources[e.source]?.path)].join(' '))).sort((a,b)=>{
    if(state.sort==='value'){
      const numeric=v=>v!==null&&v!==''&&Number.isFinite(Number(v));
      const an=numeric(a.value),bn=numeric(b.value);
      if(an&&bn)return Number(a.value)-Number(b.value)||L(a.label).localeCompare(L(b.label),lang);
      if(an!==bn)return an?-1:1;
    }
    return L(a.label).localeCompare(L(b.label),lang);
  });}
  function inventory(){return data.inventory.filter(r=>(state.category==='all'||state.category==='inventory')&&['all','reported'].includes(state.basis)&&['all','top'].includes(state.scope)&&(state.inventory==='all'||(state.inventory==='standard'?!['macro','physical'].includes(r.category):r.category===state.inventory))&&qMatches([r.master,r.category,r.sourceGroup,r.count,num(r.count),r.areaTotal,'µm² µm instances'].join(' '))).sort((a,b)=>state.sort==='value'?a.count-b.count:a.master.localeCompare(b.master));}
  function badge(m){return `<span class="sp-basis ${m.basis}" title="${esc(t('Value classification; tool reports have not been rerun by the website.','Phân loại giá trị; website không chạy lại báo cáo công cụ.'))}">${basis(m.basis)}</span>`;}
  function statusBadge(s){return `<span class="sp-status ${s.toLowerCase().replaceAll(' ','-')}">${status(s)}</span>`;}
  function pageRows(rows,id,size=12){const max=Math.max(1,Math.ceil(rows.length/size));state.pages[id]=Math.min(state.pages[id]||0,max-1);return {rows:rows.slice(state.pages[id]*size,(state.pages[id]+1)*size),max,size};}
  function pager(id,max,total){return `<div class="sp-pager"><span>${num(total)} ${t('records','bản ghi')}</span><div><button data-sp-page="${id}" data-direction="-1" ${!state.pages[id]?'disabled':''} aria-label="${t('Previous page','Trang trước')}">←</button><span>${(state.pages[id]||0)+1} / ${max}</span><button data-sp-page="${id}" data-direction="1" ${state.pages[id]>=max-1?'disabled':''} aria-label="${t('Next page','Trang sau')}">→</button></div></div>`;}
  function metricTable(rows,id){const paged=pageRows(rows,id);return `<div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>${t('Parameter','Thông số')}</th><th>${t('Value / unit','Giá trị / đơn vị')}</th><th>${t('Evidence','Bằng chứng')}</th><th>${t('Scope / stage','Phạm vi / giai đoạn')}</th><th><span class="sp-sr">${t('Actions','Thao tác')}</span></th></tr></thead><tbody>${paged.rows.map(m=>`<tr data-spec-id="${esc(m.id)}"><td><button class="sp-parameter" data-sp-source="${esc(m.id)}">${label(L(m.label))}</button>${m.status!=='AVAILABLE'?statusBadge(m.status):''}</td><td class="sp-value ${m.value===null?'unavailable':''}"><strong>${esc(val(m))}</strong><small>${esc(unit(m.unit))}</small></td><td>${badge(m)}</td><td class="sp-context"><span>${esc(L(m.scope))}</span><small>${esc(L(m.stage))}</small></td><td class="sp-row-actions"><button data-sp-copy="${esc(m.id)}" ${m.value===null?'disabled':''} title="${t('Copy value','Sao chép giá trị')}" aria-label="${esc(t('Copy ','Sao chép ')+L(m.label))}">${icons.copy}</button><button data-sp-source="${esc(m.id)}" title="${t('Source details','Chi tiết nguồn')}" aria-label="${esc(t('Source for ','Nguồn cho ')+L(m.label))}">${icons.source}</button>${figsFor(m.id).length?`<button class="sp-ev-button" data-ev-open="${esc(figsFor(m.id)[0].id)}" title="${t('Evidence image','Ảnh minh chứng')}" aria-label="${esc(t('Evidence image for ','Ảnh minh chứng cho ')+L(m.label))}">▣</button>`:''}</td></tr>`).join('')}</tbody></table></div>${pager(id,paged.max,rows.length)}`;}
  function inventoryTable(rows){
    const p=pageRows(rows,'inventory');const kinds=[['all',t('All masters','Mọi master')],['standard',t('Standard cells · no fill/decap/tap','Cell chuẩn · trừ fill/decap/tap')],['macro',t('Macros','Macro')],['sequential',t('Sequential','Tuần tự')],['combinational',t('Combinational','Tổ hợp')],['buffer',t('Buffers / inverters','Buffer / inverter')],['physical',t('Physical cells','Cell vật lý')],['other',t('Other','Khác')]];
    return `<div class="sp-inventory-tools"><select id="sp-inventory" aria-label="${t('Inventory category','Nhóm trong danh mục')}">${kinds.map(([id,n])=>`<option value="${id}" ${id===state.inventory?'selected':''}>${n}</option>`).join('')}</select><span>${t('Top-level master counts. Placement status requires the local Layout Explorer.','Số master cấp top. Tra trạng thái bố trí bằng Layout Explorer cục bộ.')}</span></div><div class="sp-table-wrap"><table class="sp-table sp-inventory-table"><thead><tr><th>${t('Cell / macro master','Master cell / macro')}</th><th>${t('Count','Số lượng')}</th><th>${t('Area each / total','Diện tích mỗi / tổng')} (µm²)</th><th>${t('Footprint','Footprint')} (µm)</th><th>${t('Inspect','Kiểm tra')}</th></tr></thead><tbody>${p.rows.map(r=>`<tr><td><button class="sp-master" data-sp-master-source="${r.id}">${esc(r.master)}</button><small class="sp-master-category">${esc(kinds.find(k=>k[0]===r.category)?.[1]||r.category)}</small></td><td class="sp-number">${num(r.count)}</td><td class="sp-number">${num(r.areaEach)}<small>${num(r.areaTotal)}</small></td><td class="sp-number">${r.width===null?'N/A':`${num(r.width)} × ${num(r.height)}`}<small>${r.width===null?t('No dimensions extracted','Chưa trích kích thước'):'LEF SIZE'}</small></td><td><button class="sp-locate" data-sp-locate="${r.id}" ${r.layout?'':'disabled'} title="${r.layout?t('Find exact-master instances in Layout','Tìm instance khớp master trong Layout'):t('Instance navigation requires the local server version','Tra vị trí instance cần bản chạy server cục bộ')}">${t('Find in Layout','Tìm trong Layout')} ↗</button><button class="sp-tiny-source" data-sp-master-source="${r.id}">${t('Source','Nguồn')} ↗</button></td></tr>`).join('')}</tbody></table></div>${pager('inventory',p.max,rows.length)}<p class="sp-section-note">${t('Categories retain the supplied grouping; buffer/inverter grouping additionally uses recognizable master names. Master grouping can differ from instance-role totals. No per-instance data is loaded here.','Giữ nhóm nguồn; nhóm buffer/inverter còn dựa trên tên master nhận dạng được. Nhóm theo master có thể khác tổng theo vai trò instance. Trang này không tải từng instance.')}</p>`;
  }
  function libraries(){return `<div class="sp-subheading">${t('Library availability','Tình trạng thư viện')}</div><div class="sp-table-wrap"><table class="sp-table sp-library-table"><thead><tr><th>${t('Library / file','Thư viện / tệp')}</th><th>${t('Purpose','Mục đích')}</th><th>${t('Availability','Tình trạng')}</th><th>${t('Source','Nguồn')}</th></tr></thead><tbody>${data.libraries.filter(r=>qMatches([r.name,r.type,L(r.purpose),r.path].join(' '))).map(r=>`<tr><td><code>${esc(r.name)}</code><small>${esc(r.type)}</small></td><td>${esc(L(r.purpose))}</td><td>${r.availability==='local'?t('Available locally','Có trong workspace'):r.availability==='missing'?t('Missing','Chưa có'):t('Referenced only','Chỉ được tham chiếu')}</td><td><button data-sp-file="${r.source}">${t('Inspect path','Xem đường dẫn')} ↗</button>${r.href?`<a href="${r.href}" target="_blank" rel="noopener">${t('Open file','Mở tệp')} ↗</a>`:''}</td></tr>`).join('')}</tbody></table></div><p class="sp-section-note">${t('External Linux paths are configuration evidence, not public download links.','Đường dẫn Linux bên ngoài là bằng chứng cấu hình, không phải liên kết tải công khai.')}</p>`;}
  function ecoCompare(){
    const rows=data.eco.filter(r=>r.tag==='v3r'||r.tag==='final');if(!rows.length)return '';
    return `<details class="sp-eco"><summary>${t('Comparable ECO stages · standard-cell DRV nets','Các giai đoạn ECO có thể so sánh · net DRV cell chuẩn')}</summary><div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>${t('Stage','Giai đoạn')}</th><th>Corner / RC</th><th>${t('Violating nets','Net vi phạm')}</th><th>${t('Source','Nguồn')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.tag==='final'?t('Final OL1 · final_a5','OL1 cuối · final_a5'):t('ip_v3r · round 1','ip_v3r · vòng 1')}</td><td>${esc(r.corner)}</td><td>${num(r.count)}</td><td><button data-sp-file="drv">CSV ↗</button></td></tr>`).join('')}</tbody></table></div><p class="sp-section-note">${t('Zero standard-cell DRV nets does not imply SRAM waivers or all-corner timing closure are resolved.','Không còn net DRV cell chuẩn không đồng nghĩa đã giải quyết miễn trừ SRAM hoặc timing closure mọi corner.')}</p></details>`;
  }
  function sourceCatalog(){
    const records=Object.values(data.sources).filter(s=>qMatches([s.name,s.path,L(s.stage)].join(' '))),p=pageRows(records,'sources');
    if(!records.length)return '';
    return `<details class="sp-section" data-sp-section="sources" ${state.category==='sources'||state.q||state.open.includes('sources')?'open':''}><summary><span class="sp-section-code">J</span><h2>${t('Sources & provenance','Nguồn & truy xuất bằng chứng')}</h2><span class="sp-section-count">${records.length}</span><span class="sp-chevron">⌄</span></summary><div class="sp-section-body"><p class="sp-section-note">${t('Open a record for the original path, hash, local file mtime and bounded excerpt. A file existing on disk does not automatically establish PASS.','Mở bản ghi để xem đường dẫn gốc, hash, mtime tệp cục bộ và trích đoạn giới hạn. Tệp tồn tại trên ổ đĩa không tự xác nhận PASS.')}</p><div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>${t('Report / artifact','Báo cáo / artifact')}</th><th>${t('Stage','Giai đoạn')}</th><th>${t('Availability','Tình trạng')}</th><th>${t('Inspect','Kiểm tra')}</th></tr></thead><tbody>${p.rows.map(s=>`<tr><td><code>${esc(s.name)}</code><small>${s.bytes===null?'—':s.bytes<1024?`${s.bytes} B`:`${num(s.bytes/1024,1)} KiB`}${s.partial?' · '+t('original size; excerpt only','dung lượng gốc; chỉ có trích đoạn'):''}</small></td><td>${esc(L(s.stage))}</td><td>${s.error==='parse-error'?t('Extraction failed','Lỗi trích dữ liệu'):s.available?(s.partial?t('Excerpt available','Có trích đoạn'):t('Available','Có tệp')):t('Unavailable','Chưa có')}</td><td><button data-sp-file="${s.id}">${t('Details','Chi tiết')} ↗</button></td></tr>`).join('')}</tbody></table></div>${pager('sources',p.max,records.length)}</div></details>`;
  }
  function renderResults(){
    if(!data||disposed)return;const rows=matched(),inv=inventory();
    $('[data-sp-action="export"]').disabled=rows.length+inv.length===0;
    $('#sp-results-count').textContent=`${num(rows.length)} ${t('parameters','thông số')} · ${num(inv.length)} ${t('masters','master')}`;
    const sections=[];
    for(const c of data.categories){
      if(state.category!=='all'&&state.category!==c.id)continue;
      const entries=rows.filter(m=>m.category===c.id);if(!entries.length&&c.id!=='inventory'&&!(c.id==='technology'&&data.libraries.some(r=>qMatches([r.name,r.type,L(r.purpose),r.path].join(' ')))))continue;
      if(c.id==='inventory'&&!inv.length&&!entries.length)continue;
      sections.push(`<details class="sp-section" data-sp-section="${c.id}" ${state.q||state.category!=='all'||state.open.includes(c.id)?'open':''}><summary><span class="sp-section-code">${c.letter}</span><h2>${esc(L(c.label))}</h2><span class="sp-section-count">${num(c.id==='inventory'?inv.length:entries.length)}</span><span class="sp-chevron">⌄</span></summary><div class="sp-section-body">${c.id==='inventory'?inventoryTable(inv):entries.length?metricTable(entries,c.id):''}${c.id==='technology'?libraries():''}${c.id==='physical'?ecoCompare():''}</div></details>`);
    }
    if(state.category==='sources'||state.category==='all'){const catalog=sourceCatalog();if(catalog)sections.push(catalog);}
    $('#sp-results').innerHTML=sections.length?sections.join(''):`<div class="sp-empty"><h2>${t('No matching specifications','Không có thông số phù hợp')}</h2><p>${t('Try another term, scope or evidence type.','Thử từ khóa, phạm vi hoặc loại bằng chứng khác.')}</p><button data-sp-action="reset">${t('Reset filters','Đặt lại bộ lọc')}</button></div>`;
    $('#sp-results').querySelectorAll('[data-sp-section]').forEach(d=>d.addEventListener('toggle',()=>{const id=d.dataset.spSection;state.open=state.open.filter(x=>x!==id);if(d.open)state.open.push(id);}));
    $('#sp-category').value=state.category;
  }

// Product-style project page: open storytelling sections; only the long file index is collapsed.
function organizeProject(){
  document.querySelector('.audience-section')?.remove();
  const artifacts=document.querySelector('#artifacts');
  if(artifacts&&!artifacts.querySelector('.project-section')){const heading=artifacts.querySelector('.section-heading');const details=document.createElement('details');details.className='project-section';const summary=document.createElement('summary');summary.innerHTML=`<span>${t('Open the indexed design files & reports','Mở danh sách tệp thiết kế & báo cáo')}</span><small>${data.artifacts.length} ${t('files','tệp')}</small>`;details.append(summary);[...artifacts.children].filter(n=>n!==heading).forEach(n=>details.append(n));artifacts.append(details);}
  document.querySelectorAll('#main > .section').forEach((section,i)=>section.classList.toggle('band',i%2===1));
}
function languageSwitch(compact){return `<div class="lang-switch${compact?' compact':''}" role="group" aria-label="${T('lang.group')}"><button type="button" data-lang="vi" lang="vi" aria-pressed="${lang==='vi'}">${compact?'VI':T('lang.vi')}</button><button type="button" data-lang="en" lang="en" aria-pressed="${lang==='en'}">${compact?'EN':T('lang.en')}</button></div>`;}
async function applyRoute(){
  const simulationOpen=location.hash==='#simulation';
  const serial=++routeSerial,open=location.hash==='#chip-layout',specsOpen=location.hash==='#technical-specifications',productOpen=location.hash==='#product'||location.hash.startsWith('#product-');
  const overview=document.querySelector('main#main');if(!overview)return;
  for(const [id,selected] of [['simulation-nav',simulationOpen||open],['specifications-nav',specsOpen],['product-nav',productOpen],['overview-nav',!open&&!specsOpen&&!productOpen&&!simulationOpen]]){const node=document.getElementById(id);node.classList.toggle('selected',selected);selected?node.setAttribute('aria-current','page'):node.removeAttribute('aria-current');}
  document.body.classList.toggle('layout-active',open);document.body.classList.toggle('specs-active',specsOpen);document.body.classList.toggle('product-active',productOpen);overview.hidden=open||specsOpen||productOpen;
  document.documentElement.style.scrollPaddingTop='';
  document.body.classList.toggle('simulation-active',simulationOpen);overview.hidden=overview.hidden||simulationOpen;
  document.querySelector('.skip').href=open?'#layout-main':specsOpen?'#specs-main':productOpen?'#product-main':'#main';
  if(!productOpen){if(productController){productState=productController.getState();productController.dispose();productController=null;}document.querySelector('#product-main')?.remove();}
  if(!specsOpen){if(specsController){specsState=specsController.getState();specsController.dispose();specsController=null;}document.querySelector('#specs-main')?.remove();}
  if(!simulationOpen){if(physicalController){physicalState=physicalController.getState();physicalController.dispose();physicalController=null;}document.querySelector('#physical-main')?.remove();document.querySelector('#layout-evidence')?.remove();}
  if(simulationOpen){
    if(layoutController){layoutState=layoutController.getState();layoutController.dispose();layoutController=null;}document.querySelector('#layout-main')?.remove();document.querySelector('.skip').href='#physical-main';
    document.title=t('GEMM32 · 3D Physical Design Explorer','GEMM32 · Khám phá thiết kế vật lý 3D');
    if(physicalController)return;
    let host=document.querySelector('#physical-main');if(!host){host=document.createElement('main');host.id='physical-main';host.className='physical-main';host.tabIndex=-1;document.querySelector('.workspace').append(host);}window.scrollTo(0,0);
    document.querySelector('.skip').onclick=event=>{const target=document.querySelector('#physical-main');if(target){event.preventDefault();target.focus();}};
    try{const module=(await SHARE_LOAD_PHYSICAL());if(serial!==routeSerial||location.hash!=='#simulation')return;physicalController=module.mountPhysical(host,{lang,saved:physicalState});ensureLayoutEvidence();}catch(error){host.textContent=error.message;}
    return;
  }
  if(productOpen){
    if(layoutController){layoutState=layoutController.getState();layoutController.dispose();layoutController=null;}
    document.querySelector('#layout-main')?.remove();
    document.title=t('GEMM32 · Product references','GEMM32 · Tham khảo sản phẩm');
    if(productController){if(location.hash.startsWith('#product-'))document.getElementById(location.hash.slice(1))?.scrollIntoView();else window.scrollTo({top:0,behavior:'instant'});return;}

function renderArtifacts() {

  document.querySelector('#artifact-list').innerHTML = rows.map(a=>`<div class="artifact-row"><span class="file-icon ${reportIds.includes(a.id)?'report-icon':''}">${icon(a.id==='rtl'||a.id==='netlist'?'code':reportIds.includes(a.id)?'file':'layers')}</span><div class="file-description"><strong>${esc(a.name)}</strong><p>${artifactText(a.id)}</p></div><span class="file-type">${a.type}</span><span class="file-size">${formatBytes(a.bytes)}</span><button class="artifact-action" data-artifact="${a.id}" aria-label="${t('Inspect','Xem')} ${esc(a.name)}">${t('Inspect','Xem')}${icon('arrow')}</button></div>`).join('');

function showDialog(content, cls='') {

function bind() {
  syncNavigation();

    const next=button.dataset.lang;if(next===lang)return;
    const scroll=window.scrollY,compact=!!button.closest('.compact');lang=next;T=translator(lang);rememberLanguage(lang);
    // Keep the live 3D scene: detach its host, re-render the shell, re-attach and translate in place.
    const host=document.querySelector('#physical-main');keepPhysical=physicalController?.setLang&&host?host:null;keepPhysical?.remove();
    render();
    if(keepPhysical){document.querySelector('.workspace').append(keepPhysical);physicalController.setLang(lang);keepPhysical=null;ensureLayoutEvidence();}
    window.scrollTo({top:scroll,behavior:'instant'});
    document.querySelector(`${compact?'.compact ':'.lang-switch:not(.compact) '}[data-lang="${lang}"]`)?.focus({preventScroll:true});
  }));
  document.querySelector('#menu-toggle').addEventListener('click',e=>{

    artifactFilter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));renderArtifacts();
  }));

function updateLayoutZoom() {
  const img=document.querySelector('#layout-preview'), canvas=document.querySelector('.layout-canvas'), slider=document.querySelector('#layout-zoom');
  if(!img?.naturalWidth||!canvas||!slider) return;

  img.style.width=Math.floor(fit*Number(slider.value)/100)+'px';
  document.querySelector('#zoom-output').textContent=slider.value+'%';
}
